[project]
name = "subtitle-search"
version = "0.1.0"
description = "A reading-first viewer for Zoom transcripts, with quote highlighting and estimated media seeking."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
subtitle-search = "subtitle_search.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subtitle_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
